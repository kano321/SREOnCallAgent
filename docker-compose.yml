# SRE On-Call Agent demo stack
#
#   docker compose up -d
#   Prometheus UI:    http://localhost:9090
#   Alertmanager UI:  http://localhost:9093
#
# P0① metric_query -> Prometheus（demo-exporter 模拟三服务指标）
# P0② Alertmanager -> /webhook/alert 自动触发调查
# P0③④ 后续扩展：Loki / promtail / Grafana
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sre-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - demo-exporter

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sre-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus

  demo-exporter:
    image: python:3.12-alpine
    container_name: sre-demo-exporter
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./docker/demo_exporter.py:/app/demo_exporter.py:ro
    command: ["python", "/app/demo_exporter.py"]

volumes:
  prometheus-data: