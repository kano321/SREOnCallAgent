<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRE On-Call Agent · 监控台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <h1>SRE On-Call Agent</h1>
      <span class="sub">AI 值班助手监控台</span>
    </div>
    <div class="topbar-right">
      <span id="userName" class="user-name"></span>
      <button id="logoutBtn" class="btn-logout">退出登录</button>
      <div id="status" class="status ok">● 服务正常</div>
    </div>
  </header>

  <main class="layout">
    <!-- ============ 左侧栏 ============ -->
    <aside class="sidebar">
      <section class="panel">
        <h2>事故选择</h2>
        <div id="incidentList" class="incident-list"></div>
        <button id="runBtn" class="btn-run" disabled>▶ 开始调查</button>
      </section>

      <section class="panel">
        <h2>历史报告</h2>
        <ul id="reportList" class="report-list"></ul>
      </section>
    </aside>

    <!-- ============ 主内容区 ============ -->
    <section class="content">
      <div id="runs" class="runs">
        <div class="placeholder" id="emptyHint">选择左侧事故，点击「开始调查」</div>
      </div>
      <label class="scroll-toggle">
        <input type="checkbox" id="autoscroll" checked> 自动滚动
      </label>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
