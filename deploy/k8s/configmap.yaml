apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-oncall-config
  labels:
    app.kubernetes.io/name: sre-oncall-agent
data:
  APP_ENV: production
  MYSQL_HOST: sre-mysql
  MYSQL_PORT: "3306"
  MYSQL_DB: sre_agent
  LLM_TIMEOUT: "60"
  LLM_MAX_RETRIES: "2"
  LLM_RETRY_BASE_SECONDS: "0.5"
  LLM_REQUEST_BUDGET_SECONDS: "120"
  WEBHOOK_DEDUP_SECONDS: "600"
  SESSION_COOKIE_SECURE: "false"
  ALLOW_LEGACY_QUERY_TOKEN: "false"
  DB_INIT_MAX_ATTEMPTS: "30"
  DB_INIT_RETRY_SECONDS: "2"
  MYSQL_POOL_MIN_CACHED: "1"
  MYSQL_POOL_MAX_CACHED: "5"
  MYSQL_POOL_MAX_CONNECTIONS: "10"
