# Example only. Create the real Secrets with kubectl as shown in README.md.
apiVersion: v1
kind: Secret
metadata:
  name: sre-mysql-secret
  namespace: sre-oncall
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-me
  MYSQL_DB: sre_agent
  MYSQL_USER: sre
  MYSQL_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-app-secret
  namespace: sre-oncall
type: Opaque
stringData:
  LLM_API_KEY: replace-me
  LLM_BASE_URL: https://api.example.com/v1
  LLM_MODEL_ID: replace-me
  WEBHOOK_TOKEN: replace-me
