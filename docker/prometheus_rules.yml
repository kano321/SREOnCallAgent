groups:
  - name: sre-oncall-demo
    rules:
      - alert: SreOnCallAgentDown
        expr: up{job="sre-oncall-agent"} == 0
        for: 30s
        labels:
          severity: P1
          service: sre-oncall-agent
        annotations:
          summary: "SRE On-Call Agent is unavailable"
          description: "Prometheus cannot scrape the application metrics endpoint."
          value: "{{ $value }}"
          threshold: "1"
          unit: "up"

      - alert: SreOnCallAgentHigh5xxRate
        expr: |
          (
            sum(rate(sre_http_requests_total{job="sre-oncall-agent",status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(sre_http_requests_total{job="sre-oncall-agent"}[2m])), 0.001)
          ) > 0.05
        for: 1m
        labels:
          severity: P1
          service: sre-oncall-agent
        annotations:
          summary: "SRE On-Call Agent 5xx rate is elevated"
          description: "More than 5 percent of application requests are failing with 5xx responses."
          value: "{{ $value }}"
          threshold: "0.05"
          unit: "ratio"

      - alert: SreOnCallAgentHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(sre_http_request_duration_seconds_bucket{job="sre-oncall-agent"}[2m])
            )
          ) > 1
        for: 1m
        labels:
          severity: P2
          service: sre-oncall-agent
        annotations:
          summary: "SRE On-Call Agent P95 latency is high"
          description: "The application P95 HTTP latency has exceeded one second."
          value: "{{ $value }}"
          threshold: "1"
          unit: "seconds"

      - alert: SreInvestigationFailures
        expr: increase(sre_investigations_total{job="sre-oncall-agent",status="error"}[5m]) > 0
        for: 30s
        labels:
          severity: P2
          service: sre-oncall-agent
        annotations:
          summary: "Incident investigations are failing"
          description: "At least one investigation failed during the last five minutes."
          value: "{{ $value }}"
          threshold: "0"
          unit: "failures"

      - alert: DBConnectionPoolSaturation
        expr: db_pool_active_connections{service="checkout-service"} > 8
        for: 30s
        labels:
          severity: P1
          service: checkout-service
        annotations:
          summary: "DB connection pool saturation"
          description: "checkout-service database pool usage is above 8 connections."
          value: "{{ $value }}"
          threshold: "8"
          unit: "connections"

      - alert: PodMemoryHigh
        expr: pod_memory_usage_percent{service="auth-service"} > 85
        for: 30s
        labels:
          severity: P1
          service: auth-service
        annotations:
          summary: "Pod memory usage is high"
          description: "auth-service memory usage is above 85 percent and may OOM."
          value: "{{ $value }}"
          threshold: "85"
          unit: "percent"

      - alert: PaymentSuccessRateLow
        expr: payment_success_rate{service="payment-service"} < 95
        for: 30s
        labels:
          severity: P2
          service: payment-service
        annotations:
          summary: "Payment success rate is below SLO"
          description: "payment-service success rate is below 95 percent."
          value: "{{ $value }}"
          threshold: "95"
          unit: "percent"
