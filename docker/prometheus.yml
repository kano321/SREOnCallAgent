# Prometheus configuration for the SRE On-Call Agent demo stack.
# Scrapes the demo-exporter, which simulates three services
# (checkout-service / auth-service / payment-service).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/prometheus_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ["demo-exporter:8001"]