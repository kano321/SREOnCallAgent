# Alertmanager configuration (P0②): 所有告警统一转发到
# SRE On-Call Agent 的 webhook 端点（host.docker.internal 指向宿主机）。
# token 以查询参数传递（跨版本最稳；新版本可用 http_config.http_headers），
# 与 .env 的 WEBHOOK_TOKEN（默认 sre-webhook-dev）保持一致。
route:
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 3m
  receiver: sre-webhook

receivers:
  - name: sre-webhook
    webhook_configs:
      - url: "http://host.docker.internal:8000/webhook/alert?token=sre-webhook-dev"
        send_resolved: false